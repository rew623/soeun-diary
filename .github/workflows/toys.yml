# 원주 장난감도서관(문막) 장난감 목록을 받아 data/toys.json으로 (문 여는 화~토, 하루 4번 KST 9·12·15·18시쯤)
name: 장난감 대여 목록 받기
on:
  schedule:
    - cron: '7 0,3,6,9 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toys
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/fetch-toys.mjs
      - name: 바뀐 게 있으면 main에 올리기
        run: |
          git add -A data
          if git diff --cached --quiet; then echo "그대로라 올리지 않아요"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "장난감 대여 목록 갱신"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
