# 수유 알람 예비: Firebase 서버(functions/feedAlarm, 1분마다)가 멈췄을 때만 대신 보내요 (10분마다 확인)
name: 수유 알람 보내기

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '1이면 보내지 않고 보낼 게 있는지만 봐요'
        default: '0'

concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            functions
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: firebase-admin 설치
        run: npm install --no-save --no-package-lock --no-audit --no-fund firebase-admin@12
      - name: 수유 알람
        run: node .github/scripts/feed.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY: ${{ inputs.dry || '0' }}
