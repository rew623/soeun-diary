<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수사 일지">
<title>성장 수사 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="themes.css">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('soeun-theme')||'""'),c={conan:'#2B4A7E',sanrio:'#7A4C86',kitty:'#9E3A52',purin:'#6E4A26',cinna:'#46709F',disney:'#2E3170'};if(c[t]){document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=c[t]}}catch(e){}})()</script>
<style>
:root{
  --paper:#E9DCC3; --card:#F5EDDC; --card2:#E2D3B6; --ink:#2B2622; --muted:#6B5F52; --line:#B9A889;
  --navy:#1F2A44; --red:#B3261E; --band1:#DDCCAA; --band2:#CDB78D;
  --rose:var(--red); --surface:var(--card); --median:var(--navy);
  --display:"Jua","Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
/* 글자를 눌러도 선택·검색 창이 뜨지 않게 (입력칸은 그대로) */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}   /* 안드로이드 늘어나는 스크롤 효과 끔 (아래 메뉴가 같이 밀리지 않게) */
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}   /* 줄은 낱말(어절) 사이에서만 바꿔요 ('붙이/기'처럼 끊기지 않게), 너무 긴 낱말만 끊어요 */
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:18px 20px calc(170px + env(safe-area-inset-bottom,0px))}

.filebar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:8px;font-size:12px;color:var(--muted);letter-spacing:1px}
.ghost{background:none;border:1px solid var(--muted);border-radius:4px;padding:6px 12px;font-size:13px;min-height:36px;letter-spacing:0;color:var(--ink);white-space:nowrap}
.suspect{display:flex;gap:18px;align-items:flex-start;margin-top:20px}
.polaroid{position:relative;flex-shrink:0;background:#FFFDF7;padding:8px 8px 26px;border:0;transform:rotate(-3deg);box-shadow:0 6px 14px rgba(43,38,34,.25)}
.polaroid img{display:block;width:150px;height:180px;object-fit:cover;object-position:center 25%}
.polaroid .cap{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:11px;color:var(--muted)}
.polaroid .clip{position:absolute;top:-16px;right:18px}
.polaroid.empty{width:166px;height:214px;display:grid;place-items:center;color:var(--muted);font-size:13px;border:2px dashed var(--line);background:var(--card);box-shadow:none;line-height:1.6}
.info{display:flex;flex-direction:column;gap:4px;padding-top:6px;font-size:13px;min-width:0}
.info .lab{font-size:12px;color:var(--muted)}
.info .nm{font-family:var(--display);font-weight:400;font-size:30px;color:var(--navy);line-height:1.1;word-break:keep-all}
.squad{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.squad .lab{font-size:12px;color:var(--muted);letter-spacing:1px}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.idb{display:flex;align-items:center;gap:10px;background:#FFFDF7;border:1px solid var(--line);padding:8px;border-radius:4px;font-size:12px;text-align:left;min-width:0}
.idb .ph{width:52px;height:52px;object-fit:cover;border:2px solid var(--navy);border-radius:3px;flex-shrink:0;display:grid;place-items:center;background:var(--card2);color:var(--navy)}
.idb .tx{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.idb .tx span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idb svg{flex-shrink:0;color:var(--navy)}
.idb b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--navy)}
.idb.me{border:2px solid var(--navy)}
.idb em{font-style:normal;font-size:11px;background:var(--navy);color:var(--paper);padding:1px 6px;border-radius:3px}
.quick button.on{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 14px}
.rolepick button{border:2px solid var(--navy);background:#FFFDF7;border-radius:6px;min-height:110px;font-family:var(--display);font-size:24px;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.stamp{display:inline-block;border:3px double var(--red);color:var(--red);font-family:var(--display);padding:2px 10px;border-radius:6px;transform:rotate(-8deg);opacity:.9;letter-spacing:1px;font-size:15px;margin-top:10px;align-self:flex-start}
.dday{display:flex;align-items:baseline;gap:8px;color:var(--navy);font-family:var(--display);line-height:1;margin:24px 0 14px}
.dday span{font-size:26px}.dday b{font-weight:400;font-size:clamp(4.5rem,22vw,6rem)}
.nextcard{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:var(--paper);border:0;border-radius:6px;padding:14px 16px;text-align:left}
.nextcard small{display:block;font-size:12px;color:#C7B99E}
.nextcard .t{font-family:var(--display);font-size:19px;display:block;margin:2px 0}
.nextcard .d{font-family:var(--display);font-size:26px;color:#F2B8A8;white-space:nowrap}

section{margin-top:26px}
.sh{font-size:12px;color:var(--muted);font-weight:400;margin:0 0 6px;letter-spacing:1px;display:flex;justify-content:space-between}
.sh>span:first-child{flex:none;white-space:nowrap}.sh>span:last-child:not(:first-child){min-width:0;text-align:right;margin-left:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.stat{background:none;border:0;border-right:1px dashed var(--line);padding:10px 4px 10px 0;text-align:left}
.stat+.stat{padding-left:12px}.stat:last-child{border-right:0}
.stat .l{font-size:12px;color:var(--muted)}.stat.on .l{color:var(--red);font-weight:700}
.stat .v{font-size:21px;font-weight:700;line-height:1.35}
.stat .p,.stat .dt{font-size:11px;color:var(--muted)}
.stat .p.warn{color:var(--red)}
.seg{display:flex;border:2px solid var(--ink);margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 0;font-size:14px;min-height:42px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.chartbox{background:var(--card);border:1px solid var(--line);padding:8px 4px 2px;position:relative}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 2px 0;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:-1px}
.note{margin:8px 2px 0;font-size:13px}
.note.warn{color:var(--red);border:1px solid var(--red);padding:8px 10px}
.recs{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;padding:12px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.rec-date b{display:block;font-size:14px}.rec-date span{font-size:11px;color:var(--muted)}
.rec-vals{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;font-size:15px;font-weight:700}
.rec-vals small{font-weight:400;font-size:11px;color:var(--muted);margin-right:3px}
.rec-delta,.rec-memo{grid-column:2;font-size:12px;color:var(--muted)}
.rec-delta b{color:var(--red);font-weight:700}
.rec-thumb{grid-column:3;grid-row:1/span 3;width:52px;height:52px;object-fit:cover;border:3px solid #FFFDF7;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.emptylist{padding:16px 2px;color:var(--muted);list-style:none}
.foot{margin-top:22px;font-size:11px;color:var(--muted)}

.vhead{border-bottom:2px solid var(--ink);padding-bottom:10px}
.vhead .no{font-size:12px;color:var(--muted);letter-spacing:1px}
.vhead h1{margin:2px 0 4px;font-family:var(--display);font-weight:400;font-size:30px;color:var(--navy)}
.vhead p{margin:0;font-size:13px}
.case{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-top:14px}
.case.hot{border:3px solid var(--navy)}
.case.solved{background:var(--card2)}
.case .no{font-size:11px;color:var(--muted);letter-spacing:1px}
.case .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.case h3{margin:0;font-family:var(--display);font-weight:400;font-size:21px;color:var(--navy)}
.case .dd{font-family:var(--display);font-size:20px;color:var(--red);white-space:nowrap}
.case .dd.far{font-family:var(--body);font-size:13px;color:var(--muted)}
.case .stamp{position:absolute;right:14px;top:10px;font-size:22px;transform:rotate(-14deg);margin:0}
.dline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 6px}
.dline b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--red)}
.badge{display:inline-block;margin-left:6px;font-size:11px;background:var(--red);color:#fff;padding:2px 7px;border-radius:3px;vertical-align:2px}
.dline small{display:block;font-size:12px;color:var(--muted)}
.dline .recd{font-size:14px;color:var(--muted)}
.vrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px dashed var(--line);padding:9px 0;text-align:left;min-height:48px}
.box{width:22px;height:22px;border:2px solid var(--ink);display:grid;place-items:center;flex-shrink:0}
.vn{flex:1;display:flex;flex-direction:column}.vn small{font-size:11px;color:var(--muted)}
.vd{font-size:12px;color:var(--muted);white-space:nowrap}
.cacts{display:flex;gap:8px;margin-top:10px}
.addv{border:1.5px dashed var(--line);background:none;padding:0 14px;min-height:44px;font-size:13px;color:var(--muted)}
.solve{flex:1;border:0;background:var(--red);color:#fff;font-family:var(--display);font-size:16px;min-height:44px;border-radius:4px}
.addperiod{width:100%;margin-top:14px;border:1.5px dashed var(--muted);background:none;min-height:48px;font-size:14px}
.subh{font-size:12px;color:var(--muted);font-weight:400;margin:28px 0 0;letter-spacing:1px}
.vempty{font-size:13px;color:var(--muted);margin:6px 0}

.sickgrid{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin:8px 0 10px}
.sickgrid>div{display:flex;flex-direction:column;padding:10px 0}.sickgrid>div+div{border-left:1px dashed var(--line);padding-left:12px}
.sickgrid small{font-size:12px;color:var(--muted)}.sickgrid b{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.15}
.sickbtns{display:flex;gap:8px}.sickbtns button{flex:1;border:0;background:var(--navy);color:var(--paper);font-family:var(--display);font-size:16px;min-height:48px;border-radius:4px}
.notice{margin:14px 0 0;background:var(--navy);color:var(--paper);border-radius:4px;padding:10px 12px;font-size:13px;line-height:1.55}
.logrow{display:flex;gap:10px;align-items:flex-start;width:100%;background:none;border:0;border-bottom:1px dashed var(--line);padding:10px 0;text-align:left;min-height:48px}
.logrow .lt{width:78px;flex-shrink:0;font-size:13px;font-weight:700}
.logrow .tag{flex-shrink:0;font-size:11px;color:#fff;border-radius:3px;padding:2px 6px}
.logrow .lm{flex:1;display:flex;flex-direction:column}.logrow .lm small{font-size:12px;color:var(--muted)}
.logrow .lb{font-size:12px;color:var(--muted);white-space:nowrap}
.visit{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px;font-size:13px}
.visit b{font-size:15px}.visit i{font-style:normal;color:var(--muted);margin-right:4px}
.visit .ask{background:#FFFDF7;border:1px dashed var(--line);padding:8px 10px;margin-top:2px}
.closedep{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;font-size:15px}
.closedep small{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.stepper>button{width:64px;height:64px;border:2px solid var(--ink);background:#FFFDF7;border-radius:4px;font-size:28px;flex-shrink:0}
.stepper div{display:flex;align-items:baseline;justify-content:center;gap:4px;min-width:0}
.stepper input{width:140px;border:0;background:none;text-align:center;font-family:var(--display);font-size:60px;color:var(--red);padding:0}
.stepper small{font-size:18px;color:var(--muted)}
.polas{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:6px 4px}
.pola{background:#FFFDF7;border:0;padding:8px 8px 12px;box-shadow:0 4px 12px rgba(43,38,34,.2);display:flex;flex-direction:column;gap:6px;text-align:left}
.pola.big{grid-column:1/-1;padding:10px 10px 14px}
.pola img,.pola .noph{width:100%;height:130px;object-fit:cover;object-position:center 30%;display:grid;place-items:center;background:var(--card2);color:var(--muted);font-size:12px}
.pola.big img,.pola.big .noph{height:200px}
.pola .pt{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pola .pt b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--navy)}.pola.big .pt b{font-size:20px}
.pola small{font-size:11px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcell{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:4px;align-items:stretch;font-size:12px}
.mcell img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid #FFFDF7}
.mcell .mph{width:100%;aspect-ratio:1;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.report{display:flex;flex-direction:column;gap:16px}
.rhead{border-bottom:2px solid var(--ink);padding-bottom:10px}.rhead .no,.revents .no{font-size:12px;color:var(--muted);letter-spacing:1px}
.rhead h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--navy)}
.rphoto{position:relative;align-self:center;background:#FFFDF7;padding:10px 10px 34px;transform:rotate(-2deg);box-shadow:0 8px 18px rgba(43,38,34,.25)}
.rphoto img,.rphoto .noph{width:260px;height:290px;object-fit:cover;object-position:center 30%;display:grid;place-items:center;background:var(--card2);color:var(--muted)}
.rphoto .cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px}
.rphoto .stamp{position:absolute;right:-22px;bottom:12px;font-size:20px;transform:rotate(-14deg);margin:0;background:rgba(245,237,220,.6)}
.sh[data-fold],.agh[data-fold]{cursor:pointer}
.sh[data-fold]>span:last-child::after,.agh[data-fold]::after{content:"접기 ▴";margin-left:8px;font-size:11px;color:var(--muted);font-family:var(--body);font-weight:400;letter-spacing:0;white-space:nowrap}
.folded>.sh[data-fold]>span:last-child::after,.folded>.agh[data-fold]::after{content:"펼치기 ▾";color:var(--red)}
.agh>span:first-child{flex:none;white-space:nowrap}.agh .rcur{flex:1 1 0;text-align:left}
#app section.folded>:not(.sh){display:none}
#app section.folded{padding-bottom:10px}
#app section.folded>.sh{margin-bottom:0}
.amon.folded>:not(.agh){display:none}
.rpick{align-self:center;}
.rcard100{justify-content:flex-start;gap:14px}.rcard100 .t{font-size:20px}
.r100ph{position:relative;flex-shrink:0;background:#FFFDF7;padding:5px 5px 14px;transform:rotate(-4deg);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.r100ph img{display:block;width:84px;height:96px;object-fit:cover;object-position:center 30%}
.r100ph i{position:absolute;right:-12px;bottom:-6px;font-style:normal;font-family:var(--display);font-size:15px;color:#fff;background:var(--red);border-radius:99px;padding:1px 9px;transform:rotate(8deg);box-shadow:0 2px 4px rgba(0,0,0,.3)}
/* 보기 전용(할머니 등): 남기는 단추 숨기기 */
body.viewer .fab,body.viewer .solve,body.viewer .addperiod,body.viewer .addv,body.viewer [data-al=pick],body.viewer [data-fam=up],body.viewer [data-fa=up],body.viewer [data-fam=add],body.viewer .gcard,body.viewer .gguess .ghost,body.viewer [data-act=addmom],body.viewer [data-act=addmonth],body.viewer .rpick[data-al]{display:none!important}
.vban{background:#FFFDF7;border-radius:14px}
.rpick{min-height:40px;border-radius:99px;padding:6px 16px;white-space:normal;line-height:1.25}
.atools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.atools button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:#FFFDF7;border-radius:16px;padding:10px 4px;font-size:13px;color:var(--ink);box-shadow:0 2px 0 var(--line);min-width:0;word-break:keep-all}
.atools i{font-style:normal;font-size:22px;line-height:1.2}
.atools button:active{transform:translateY(2px);box-shadow:none}
.rtext{margin:0;font-size:14px;line-height:1.7}
.rstats{border-top:2px solid var(--ink)}
.rstat{display:flex;flex-direction:column;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}.rstat small{font-size:12px;color:var(--muted)}
.rstat b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--navy)}.rstat .muted{color:var(--muted)}
.rnums{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:2px solid var(--ink);padding-bottom:10px;text-align:center}
.rnums b{display:block;font-family:var(--display);font-weight:400;font-size:28px;color:var(--red)}.rnums small{font-size:12px;color:var(--muted)}
.revents{display:flex;flex-direction:column;gap:4px;font-size:14px}
.rfoot small{display:block;font-size:12px;color:var(--muted)}.rfoot b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--navy)}
.tabbar button{font-size:12px}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:0;margin-bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--red);color:#fff;border:0;border-radius:6px;padding:13px 20px;font-family:var(--display);font-size:17px;box-shadow:0 6px 14px rgba(43,38,34,.3);z-index:5}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabbar button{flex:1;max-width:280px;background:none;border:0;border-top:3px solid transparent;color:#9AA3B8;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;min-height:62px}
.tabbar button.on{color:var(--paper);border-top-color:var(--red)}

.scrim{position:fixed;inset:0;background:rgba(31,42,68,.45);display:none;z-index:10}
.scrim.open{display:block}

/* 글씨: 동글동글 (제목 Jua, 본문 Gowun Dodum) */
body{font-size:15.5px;letter-spacing:-.1px}
.stat .v,.rec-vals,.rec-date b{font-family:var(--display);font-weight:400}
.stat .v{font-size:23px}.rec-vals{font-size:17px}
/* 편집창: 크게, 또렷하게 */
.sheet h3{display:flex;align-items:center;gap:10px;font-size:23px}
.shc{flex-shrink:0;width:42px;height:42px;border-radius:50%;background:#FCEBD3;border:1.5px solid var(--line);display:grid;place-items:center;overflow:hidden}
.shc .chr{width:46px;height:46px}
.field>span{font-size:14px;color:var(--navy);font-weight:700;margin-bottom:7px}
.field input,.field textarea{font-size:17px;background:#FFFDF7;min-height:52px}
.field input:focus,.field textarea:focus,.addrow input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 4px rgba(31,42,68,.12)}
.field input::placeholder,.field textarea::placeholder{color:#B5A58C}
.hint{font-size:13px;line-height:1.55}
.sheet .actions{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));margin:10px -20px calc(-22px - env(safe-area-inset-bottom,0px));padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,248,236,0),var(--card) 30%);z-index:2}
.pbox{position:relative;display:block;width:100%;min-height:128px;border:2px dashed var(--line);border-radius:20px;background:#FFFDF7;cursor:pointer;overflow:hidden}
.pbox:active{background:#FFF3E3}
.pbox .pv{display:block;width:100%;height:220px;object-fit:contain;border:0;border-radius:0;background:var(--card2)}
.pbox .pv[hidden],.pbox input[type=file]{display:none}
.pbox-in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:124px;color:var(--navy);text-align:center}
.pbox-in svg{width:34px;height:34px;color:var(--red)}
.pbox-in b{font-family:var(--display);font-weight:400;font-size:17px}
.pbox-in small{font-size:12px;color:var(--muted)}
.pbox-ch{display:none;position:absolute;right:10px;bottom:10px;background:rgba(31,42,68,.85);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px}
.pbox:has(.pv:not([hidden])) .pbox-in{display:none}
.pbox:has(.pv:not([hidden])) .pbox-ch{display:block}
.prm{padding:8px 2px 0;font-size:13px}
.prm[hidden]{display:none}
.polaroid.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.4}
.rolepick button{gap:2px}
.onb .big{font-size:2.5rem}
