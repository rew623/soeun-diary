# 원주시 병·의원·약국 정보를 공공데이터에서 받아 hospitals.json, pharmacies.json으로 올려요
name: 병원 정보 받기

on:
  schedule:
    - cron: '0 18 * * 0'   # 매주 월요일 새벽 3시(KST) = 일요일 18:00(UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hospitals
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 병원 목록 받기
        run: node .github/scripts/fetch-hospitals.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}

      # 병원이 실패해도 약국은 받고, 한쪽이 실패해도 받은 쪽은 올려요 (실패한 쪽은 빨간불로 남아요)
      - name: 약국 목록 받기
        if: ${{ !cancelled() }}
        run: node .github/scripts/fetch-pharmacies.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}

      - name: 바뀐 게 있으면 main에 올리기
        if: ${{ !cancelled() }}
        run: |
          for f in hospitals.json pharmacies.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "병원·약국 정보가 그대로라 올리지 않아요"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "병원·약국 정보 갱신 (원주시)"
          git push origin HEAD:main
